# US cash-open ORB on MNQ: opening range from 09:30 New York (DST-aware), flat by 15:55.
# Same engine and rules as the London ORB; only the session moves. The points range filter is off
# because NY ranges are 3-5x larger than at 07:00 UTC+2 (sizing still caps risk at 1%).
[base]
tz = "America/New_York"
or_start = "09:30"
entry_end = "12:00"
hold_end = "15:55"
min_range = 0
max_range = 1000
commission_rt = 1.24
slippage_ticks = 1

[grid]
or_minutes = [5, 10, 15, 20, 30, 45, 60]
entry = ["close", "touch"]
signal_tf = [1, 5]
stop = ["opposite", "mid"]
rr = [1.0, 1.5, 2.0, 3.0]
hold_end = ["12:00", "15:55"]

[validation]
sort = "sharpe"
min_trades_yr = 40
oos_frac = 0.3

[walkforward]
train_months = 24
test_months = 6
